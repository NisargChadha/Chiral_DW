[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiral-dw"
version = "0.1.0"
description = "Variational projector calculations for chiral domain-wall charge response"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy",
  "pydantic>=2",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
plot = [
  "matplotlib",
]

[project.scripts]
chiral-dw-ac-cg = "chiral_dw.cli:run_ac_cg_console"
chiral-dw-continuum-symmetric-hf = "chiral_dw.cli:run_continuum_symmetric_hf_console"
chiral-dw-ideal-conjugate-lll-charge = "chiral_dw.cli:run_ideal_conjugate_lll_charge_console"
chiral-dw-qhfm-charge = "chiral_dw.cli:run_qhfm_charge_console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
